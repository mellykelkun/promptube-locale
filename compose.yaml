name: promptube_admin

services:
  admin-promptube-reverse-proxy:
    image: admin-promptube-reverse-proxy:1.31.3
    build:
      context: ./docker/proxy
    depends_on:
      admin-promptube-app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_HTTP_PORT:?ADMIN_HTTP_PORT is required}:8080"
    networks:
      - frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  admin-promptube-app:
    image: admin-promptube-app:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:?NEXT_PUBLIC_APP_NAME is required}
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:?BETTER_AUTH_BASE_URL is required}
      BETTER_AUTH_SECRET_FILE: /run/secrets/admin-promptube-better-auth-secret
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:?NEXT_PUBLIC_APP_NAME is required}
      NODE_ENV: production
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/admin-promptube-postgres-app-password
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: admin-promptube-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      REDIS_HOST: admin-promptube-redis
      REDIS_PASSWORD_FILE: /run/secrets/admin-promptube-redis-password
      REDIS_PORT: 6379
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?TRUSTED_ORIGINS is required}
    expose:
      - "3000"
    networks:
      - frontend
      - backend
    secrets:
      - admin-promptube-postgres-app-password
      - admin-promptube-redis-password
      - admin-promptube-better-auth-secret
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  admin-promptube-postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_BACKUP_PASSWORD_FILE: /run/secrets/admin-promptube-postgres-backup-password
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:?POSTGRES_BACKUP_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-promptube-postgres-password
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    expose:
      - "5432"
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql
    secrets:
      - admin-promptube-postgres-password
      - admin-promptube-postgres-backup-password
    restart: unless-stopped
    read_only: true
    shm_size: 128mb
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" --host 127.0.0.1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin-promptube-redis:
    image: redis:8.6.5-alpine3.23@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9
    entrypoint: ["/usr/local/bin/admin-promptube-redis-entrypoint"]
    expose:
      - "6379"
    networks:
      - backend
    volumes:
      - redis-data:/data
      - ./docker/redis/entrypoint.sh:/usr/local/bin/admin-promptube-redis-entrypoint:ro
    secrets:
      - admin-promptube-redis-password
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$(cat /run/secrets/admin-promptube-redis-password)" redis-cli
          --no-auth-warning ping | grep -qx PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  admin-promptube-object-storage:
    profiles:
      - storage
    image: admin-promptube-object-storage:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./docker/object-storage
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/admin-promptube-object-storage-password
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
    expose:
      - "9000"
      - "9001"
    networks:
      - backend
    volumes:
      - object-storage-data:/data
    secrets:
      - admin-promptube-object-storage-password
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin-promptube-db-provision:
    image: admin-promptube-tools:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["node", "scripts/db/provision.mjs"]
    profiles:
      - tools
    environment:
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/admin-promptube-postgres-app-password
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_BACKUP_PASSWORD_FILE: /run/secrets/admin-promptube-postgres-backup-password
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:?POSTGRES_BACKUP_USER is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: admin-promptube-postgres
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/admin-promptube-postgres-migration-password
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER is required}
      POSTGRES_PORT: 5432
      POSTGRES_BOOTSTRAP_PASSWORD_FILE: /run/secrets/admin-promptube-postgres-password
      POSTGRES_BOOTSTRAP_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    networks:
      - backend
    secrets:
      - admin-promptube-postgres-password
      - admin-promptube-postgres-app-password
      - admin-promptube-postgres-migration-password
      - admin-promptube-postgres-backup-password
    depends_on:
      admin-promptube-postgres:
        condition: service_healthy
    restart: "no"

  admin-promptube-db-migrate:
    image: admin-promptube-tools:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["node", "scripts/db/migrate.mjs"]
    profiles:
      - tools
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:?POSTGRES_BACKUP_USER is required}
      POSTGRES_HOST: admin-promptube-postgres
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/admin-promptube-postgres-migration-password
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER is required}
      POSTGRES_PORT: 5432
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
    networks:
      - backend
    secrets:
      - admin-promptube-postgres-migration-password
    depends_on:
      admin-promptube-postgres:
        condition: service_healthy
    restart: "no"

  admin-promptube-admin-bootstrap:
    image: admin-promptube-tools:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["node", "scripts/db/bootstrap-admin.mjs"]
    profiles:
      - tools
    environment:
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/admin-promptube-postgres-app-password
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: admin-promptube-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
    networks:
      - backend
    secrets:
      - admin-promptube-postgres-app-password
    depends_on:
      admin-promptube-postgres:
        condition: service_healthy
    restart: "no"

  admin-promptube-admin-sessions-revoke-all:
    image: admin-promptube-tools:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["node", "scripts/db/revoke-all-sessions.mjs"]
    profiles:
      - tools
    environment:
      ADMIN_REVOKE_ALL_SESSIONS_CONFIRM: ${ADMIN_REVOKE_ALL_SESSIONS_CONFIRM:-}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/admin-promptube-postgres-app-password
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: admin-promptube-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
    networks:
      - backend
    secrets:
      - admin-promptube-postgres-app-password
    depends_on:
      admin-promptube-postgres:
        condition: service_healthy
    restart: "no"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  object-storage-data:

secrets:
  admin-promptube-postgres-password:
    file: ./secrets/postgres-password
  admin-promptube-postgres-app-password:
    file: ./secrets/postgres-app-password
  admin-promptube-postgres-migration-password:
    file: ./secrets/postgres-migration-password
  admin-promptube-postgres-backup-password:
    file: ./secrets/postgres-backup-password
  admin-promptube-redis-password:
    file: ./secrets/redis-password
  admin-promptube-better-auth-secret:
    file: ./secrets/better-auth-secret
  admin-promptube-backup-encryption-key:
    file: ./secrets/backup-encryption-key
  admin-promptube-object-storage-password:
    file: ./secrets/object-storage-password
