name: promptube_admin_rotation_test

services:
  admin-rotation-postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    environment:
      POSTGRES_DB: rotation_check
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-rotation-postgres-password
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - backend
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=256m
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    secrets:
      - admin-rotation-postgres-password
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname rotation_check --host 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  admin-rotation-redis:
    image: redis:8.6.5-alpine3.23@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9
    entrypoint: ["/usr/local/bin/admin-promptube-redis-entrypoint"]
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/admin-rotation-redis-password
    expose:
      - "6379"
    networks:
      - backend
    volumes:
      - ./docker/redis/entrypoint.sh:/usr/local/bin/admin-promptube-redis-entrypoint:ro
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=16m
    secrets:
      - admin-rotation-redis-password
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$(cat /run/secrets/admin-rotation-redis-password)" redis-cli
          --no-auth-warning ping | grep -qx PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

networks:
  backend:
    internal: true

secrets:
  admin-rotation-postgres-password:
    file: ${ROTATION_TEST_SECRETS_DIR:?ROTATION_TEST_SECRETS_DIR is required}/postgres-password
  admin-rotation-redis-password:
    file: ${ROTATION_TEST_SECRETS_DIR:?ROTATION_TEST_SECRETS_DIR is required}/redis-password
