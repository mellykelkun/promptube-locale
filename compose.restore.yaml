name: promptube_admin_restore_test

services:
  admin-restore-postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    environment:
      POSTGRES_DB: restore_template
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-restore-postgres-password
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - backend
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=384m
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    secrets:
      - admin-restore-postgres-password
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready --username postgres --dbname restore_template --host 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  backend:
    internal: true

secrets:
  admin-restore-postgres-password:
    file: ${RESTORE_TEST_SECRETS_DIR:?RESTORE_TEST_SECRETS_DIR is required}/postgres-password
